{{ define "main" }}
<h1>{{ .Title }}</h1>

<div class="courses-grid">
  {{ range $key, $course := .Site.Data.mycourses }}
  <a href="{{ $course.url }}" target="_blank" rel="noopener" class="course-card">
    <img src="{{ $course.image }}" alt="{{ $course.title }}">
    <h3>{{ $course.title }}</h3>
    <p>{{ $course.description }}</p>
    {{ if $course.subject }}
    <p class="course-subject">
      {{ range $course.subject }}<span class="subject-tag">{{ . }}</span>{{ end }}
    </p>
    {{ end }}
  </a>
  {{ end }}
</div>
{{ end }}
