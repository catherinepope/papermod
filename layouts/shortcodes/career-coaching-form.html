<div class="contact-form">    
        <form name="career" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/success/">
            <!-- Hidden field for bot detection -->
            <input type="hidden" name="form-name" value="career" />
            <div style="display: none;">
                <label>Don't fill this out if you're human: <input name="bot-field" /></label>
            </div>
            
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="current-work">What work are you currently doing?</label>
                <textarea id="current-work" name="current-work" required></textarea>
            </div>
            
            
            <div class="form-group">
                <label for="future-work">What work would you like to do?</label>
                <textarea id="future-work" name="future-work" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="challenges">What's getting in your way?</label>
                <textarea id="challenges" name="challenges" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="attempts">Is there anything you've tried that hasn't worked?</label>
                <textarea id="attempts" name="attempts"></textarea>
            </div>
            
             <div class="form-group">
                <label for="support">What kind of support are you seeking with your career change?</label>
                <textarea id="support" name="support"></textarea>
            </div>
            
            <div class="form-group">
                <label for="sessions">How many sessions would you like?</label>
                <textarea id="sessions" name="sessions" placeholder="This is to help me plan a programme, you're not committing yourself." required></textarea>
            </div>
            
            <div class="form-group">
                <label for="share">Is there anything else you'd like to share with me?</label>
                <textarea id="share" name="share"></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

<p style="margin-top: 20px;">By submitting, you agree to my <a href="/privacy-policy/">Privacy Policy</a>.</p>
