<div class="contact-form">    
        <form name="viva" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/success/">
            <!-- Hidden field for bot detection -->
            <input type="hidden" name="form-name" value="viva" />
            <div style="display: none;">
                <label>Don't fill this out if you're human: <input name="bot-field" /></label>
            </div>
            
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="topic">Please tell me about your research topic. You're welcome to paste an abstract here.</label>
                <textarea id="topic" name="topic" required></textarea>
            </div>
            
             <div class="form-group">
                <fieldset>
                    <legend>Have you submitted your thesis?</legend>
                    <label>
                        <input type="radio" name="submitted" value="yes" required>
                        Yes
                    </label>
                    <label>
                        <input type="radio" name="submitted" value="no">
                        No
                    </label>
                </fieldset>
            </div>
            
            <div class="form-group">
                <label for="viva">Do you have a date for your viva? Or do you know roughly when it'll happen?</label>
                <textarea id="viva" name="viva" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="concerns">Do you have any specific concerns about the viva?</label>
                <textarea id="concerns" name="concerns"></textarea>
            </div>
            
             <div class="form-group">
                <label for="support">What kind of support are you seeking for your viva preparation?</label>
                <textarea id="support" name="support"></textarea>
            </div>
            
            <div class="form-group">
                <label for="sessions">How many sessions would you like?</label>
                <textarea id="sessions" name="sessions" placeholder="This is to help me plan a programme, you're not committing yourself." required></textarea>
            </div>
            
            <div class="form-group">
                <label for="share">Is there anything else you'd like to share with me?</label>
                <textarea id="share" name="share"></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

<p style="margin-top: 20px;">By submitting, you agree to my <a href="/privacy-policy/">Privacy Policy</a>.</p>
